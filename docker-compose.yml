version: '3.7'
services:
  app:
    build: .
    ports:
      - '5000:5000'
      - '5001:5001'
    environment:
      - ASPNETCORE_Kestrel__Certificates__Default__Password=SupahSecretPassw0rd
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/.aspnet/https/aspnetapp.pfx
      - ASPNETCORE_URLS=http://*:5000;https://*:5001
    depends_on:
      - db
    networks:
      - lonza
    volumes:
      - /root/.aspnet:/.aspnet/
  db:
    ports:
      - '1433:1433'
    image: 'mcr.microsoft.com/mssql/server'
    environment:
      SA_PASSWORD: 'SupahAdmin1'
      ACCEPT_EULA: 'Y'
    networks:
      - lonza
networks:
  lonza:
